{% extends "base.html" %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card border-0 shadow rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="security-icon">🔐</div>
                        <h2 class="h4 fw-bold mb-1">Şifre Değiştir</h2>
                        <p class="text-muted mb-0">
                            Güvenlik için varsayılan şifrenizi değiştirmeniz gerekiyor.
                        </p>
                    </div>

                    <div class="alert alert-warning rounded-3">
                        Yeni şifre en az 8 karakter olmalı, kullanıcı adıyla aynı olmamalı ve
                        <strong>admin123</strong> tekrar kullanılmamalıdır.
                    </div>

                    <form method="post" action="{{ url_for('auth.change_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mevcut Şifre</label>
                            <input
                                type="password"
                                name="current_password"
                                class="form-control form-control-lg rounded-3"
                                autocomplete="current-password"
                                required
                                autofocus
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Yeni Şifre</label>
                            <input
                                type="password"
                                name="new_password"
                                class="form-control form-control-lg rounded-3"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Yeni Şifre Tekrar</label>
                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control form-control-lg rounded-3"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">
                            Şifreyi Güncelle
                        </button>
                    </form>

                    <form method="post" action="{{ url_for('auth.logout') }}" class="mt-3">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-outline-secondary w-100 rounded-3">
                            Çıkış Yap
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
